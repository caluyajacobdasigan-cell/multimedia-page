<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f0f0;
      font-family: Arial, sans-serif;
    }
    
    .card {
      background: white;
      width: 300px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      padding: 20px;
    }
    
    .card img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 15px;
      border: 3px solid #4CAF50;
    }
    
    .card h2 {
      margin: 10px 0 5px;
      font-size: 22px;
      color: #333;
    }
    
    .card p.title {
      color: #777;
      font-size: 14px;
      margin-bottom: 15px;
    }
    
    .card p.bio {
      font-size: 14px;
      color: #555;
      margin-bottom: 20px;
    }
    
    .card button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }
    
    .card button:hover {
      background: #45a049;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="profile.png" alt="profile.png">
<img src="profile.png" alt="Picture 1">
<img src="profile.png" alt="Picture 2">
<img src="profile.png" alt="Picture 3">
    <h2>Jacob Caluya</h2>
    <p class="title">Web Developer</p>
    <p class="bio">Matcha Lover | Roblox Developing, Gaming | From Quezon City 🇵🇭</p>
    <button>Follow</button>
  </div>

</body>
</html>
